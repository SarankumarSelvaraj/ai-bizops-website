<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F8FAFC"/>
  
  <!-- Browser Window -->
  <rect x="50" y="50" width="700" height="500" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Browser Header -->
  <rect x="50" y="50" width="700" height="40" rx="12" fill="#F1F5F9"/>
  <line x1="50" y1="90" x2="750" y2="90" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Dots -->
  <circle cx="70" cy="70" r="6" fill="#EF4444"/>
  <circle cx="90" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="110" cy="70" r="6" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="140" y="60" width="500" height="20" rx="10" fill="#E2E8F0"/>
  <text x="150" y="74" font-family="sans-serif" font-size="12" fill="#64748B">app.bizops.ai/dashboard</text>
  
  <!-- Dashboard Content -->
  <!-- Header -->
  <rect x="70" y="110" width="660" height="60" rx="8" fill="#4F46E5" opacity="0.1"/>
  <text x="90" y="145" font-family="sans-serif" font-size="24" font-weight="bold" fill="#4F46E5">Dashboard</text>
  
  <!-- Stats Cards -->
  <rect x="70" y="190" width="200" height="100" rx="8" fill="#4F46E5" opacity="0.05" stroke="#4F46E5" stroke-width="1"/>
  <text x="90" y="220" font-family="sans-serif" font-size="14" fill="#64748B">Revenue</text>
  <text x="90" y="250" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0F172A">$85K</text>
  <text x="90" y="275" font-family="sans-serif" font-size="12" fill="#10B981">↑ 12.5%</text>
  
  <rect x="290" y="190" width="200" height="100" rx="8" fill="#0EA5E9" opacity="0.05" stroke="#0EA5E9" stroke-width="1"/>
  <text x="310" y="220" font-family="sans-serif" font-size="14" fill="#64748B">Active Deals</text>
  <text x="310" y="250" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0F172A">147</text>
  <text x="310" y="275" font-family="sans-serif" font-size="12" fill="#10B981">↑ 8.2%</text>
  
  <rect x="510" y="190" width="220" height="100" rx="8" fill="#10B981" opacity="0.05" stroke="#10B981" stroke-width="1"/>
  <text x="530" y="220" font-family="sans-serif" font-size="14" fill="#64748B">Customers</text>
  <text x="530" y="250" font-family="sans-serif" font-size="32" font-weight="bold" fill="#0F172A">1,284</text>
  <text x="530" y="275" font-family="sans-serif" font-size="12" fill="#10B981">↑ 4.1%</text>
  
  <!-- Chart Area -->
  <rect x="70" y="310" width="660" height="200" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="90" y="340" font-family="sans-serif" font-size="16" font-weight="600" fill="#0F172A">Revenue Trend</text>
  
  <!-- Simple Chart Line -->
  <polyline points="90,480 140,450 190,460 240,420 290,410 340,380 390,370 440,350 490,340 540,330 590,310 640,290 690,280" 
            stroke="#4F46E5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chart Fill -->
  <path d="M 90 480 L 140 450 L 190 460 L 240 420 L 290 410 L 340 380 L 390 370 L 440 350 L 490 340 L 540 330 L 590 310 L 640 290 L 690 280 L 690 500 L 90 500 Z" 
        fill="#4F46E5" opacity="0.1"/>
  
  <!-- AI Badge -->
  <rect x="600" y="100" width="120" height="30" rx="15" fill="#4F46E5"/>
  <text x="622" y="120" font-family="sans-serif" font-size="14" font-weight="600" fill="white">✦ AI Powered</text>
</svg>
